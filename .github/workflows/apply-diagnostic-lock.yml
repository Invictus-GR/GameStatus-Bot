name: Apply Diagnostic Lock

on:
  push:
    branches: [diagnostic-suite-2026-09-01]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic-suite-2026-09-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.5.2 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Apply owner + channel lock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/diagnostics.js')
          s = p.read_text()
          old_constants = """const DIAGNOSTIC_ROLE_IDS = [
            '1529632873987178668',
            '1540715768625496135',
            '1538451886758170744'
          ];"""
          new_constants = """const DIAGNOSTIC_OWNER_ID = '758072706099970129';
          const DIAGNOSTIC_CHANNEL_ID = '1544238980634247189';"""
          old_auth = """function hasDiagnosticRole(interaction) {
            return interaction.member?.roles?.cache?.some(role =>
              DIAGNOSTIC_ROLE_IDS.includes(role.id)
            ) ?? false;
          }"""
          new_auth = """function getDiagnosticAccessError(interaction) {
            if (interaction.user.id !== DIAGNOSTIC_OWNER_ID) {
              return '❌ You are not authorized to use TLC Command diagnostics.';
            }

            if (interaction.channelId !== DIAGNOSTIC_CHANNEL_ID) {
              return `❌ Diagnostics can only be used in <#${DIAGNOSTIC_CHANNEL_ID}>.`;
            }

            return null;
          }"""
          old_handler = """  if (!hasDiagnosticRole(interaction)) {
            await interaction.reply({
              content: '❌ You do not have permission to run TLC Command diagnostics.',
              flags: MessageFlags.Ephemeral
            });
            return true;
          }

          await interaction.deferReply({ flags: MessageFlags.Ephemeral });"""
          new_handler = """  const accessError = getDiagnosticAccessError(interaction);
          if (accessError) {
            await interaction.reply({
              content: accessError,
              flags: MessageFlags.Ephemeral
            });
            return true;
          }

          await interaction.deferReply({ flags: MessageFlags.Ephemeral });"""
          old_channel = """    [context.ADMIN_REPORT_CHANNEL_ID, 'Admin report channel']
          ];"""
          new_channel = """    [context.ADMIN_REPORT_CHANNEL_ID, 'Admin report channel'],
            [DIAGNOSTIC_CHANNEL_ID, 'Diagnostics channel']
          ];"""
          for old, new, label in [
              (old_constants, new_constants, 'constants'),
              (old_auth, new_auth, 'auth function'),
              (old_handler, new_handler, 'handler gate'),
              (old_channel, new_channel, 'diagnostic channel check')]:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Could not locate {label}')
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/bot.js
          node --check src/diagnostics.js
      - name: Validate lock and command schema
        run: |
          node --input-type=module <<'EOF'
          import { diagnosticCommand } from './src/diagnostics.js';
          const json = diagnosticCommand.toJSON();
          if (json.name !== 'test') throw new Error('Expected /test command');
          const expected = ['all','queue','mods','database','armahq','status','channels','permissions','warn','changelog','daily','failsafe'];
          const actual = (json.options || []).map(option => option.name);
          for (const name of expected) if (!actual.includes(name)) throw new Error(`Missing /test ${name}`);
          EOF
          grep -q "DIAGNOSTIC_OWNER_ID = '758072706099970129'" src/diagnostics.js
          grep -q "DIAGNOSTIC_CHANNEL_ID = '1544238980634247189'" src/diagnostics.js
          grep -q "interaction.user.id !== DIAGNOSTIC_OWNER_ID" src/diagnostics.js
          grep -q "interaction.channelId !== DIAGNOSTIC_CHANNEL_ID" src/diagnostics.js
          test "$(grep -c "client.on('interactionCreate'" src/bot.js)" -eq 1
      - name: Commit locked diagnostics
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/diagnostics.js
          git commit -m 'Lock diagnostics to owner and test channel'
          git push origin HEAD:diagnostic-suite-2026-09-01
