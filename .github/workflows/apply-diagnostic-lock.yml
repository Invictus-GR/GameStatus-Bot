name: Apply Diagnostic Lock

on:
  push:
    branches: [diagnostic-suite-2026-09-01]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic-suite-2026-09-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.5.2 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Apply owner + channel lock
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/diagnostics.js')
          s = p.read_text()

          s, n1 = re.subn(
              r"const DIAGNOSTIC_ROLE_IDS = \[.*?\];",
              "const DIAGNOSTIC_OWNER_ID = '758072706099970129';\nconst DIAGNOSTIC_CHANNEL_ID = '1544238980634247189';",
              s,
              count=1,
              flags=re.S,
          )

          s, n2 = re.subn(
              r"function hasDiagnosticRole\(interaction\) \{.*?\n\}",
              """function getDiagnosticAccessError(interaction) {
            if (interaction.user.id !== DIAGNOSTIC_OWNER_ID) {
              return '❌ You are not authorized to use TLC Command diagnostics.';
            }

            if (interaction.channelId !== DIAGNOSTIC_CHANNEL_ID) {
              return `❌ Diagnostics can only be used in <#${DIAGNOSTIC_CHANNEL_ID}>.`;
            }

            return null;
          }""",
              s,
              count=1,
              flags=re.S,
          )

          s, n3 = re.subn(
              r"  if \(!hasDiagnosticRole\(interaction\)\) \{.*?\n  \}\n\n  await interaction\.deferReply\(\{ flags: MessageFlags\.Ephemeral \}\);",
              """  const accessError = getDiagnosticAccessError(interaction);
          if (accessError) {
            await interaction.reply({
              content: accessError,
              flags: MessageFlags.Ephemeral
            });
            return true;
          }

          await interaction.deferReply({ flags: MessageFlags.Ephemeral });""",
              s,
              count=1,
              flags=re.S,
          )

          old_channel = "    [context.ADMIN_REPORT_CHANNEL_ID, 'Admin report channel']\n  ];"
          new_channel = "    [context.ADMIN_REPORT_CHANNEL_ID, 'Admin report channel'],\n    [DIAGNOSTIC_CHANNEL_ID, 'Diagnostics channel']\n  ];"
          if old_channel in s:
              s = s.replace(old_channel, new_channel, 1)
              n4 = 1
          elif "[DIAGNOSTIC_CHANNEL_ID, 'Diagnostics channel']" in s:
              n4 = 1
          else:
              n4 = 0

          if n1 != 1 and "DIAGNOSTIC_OWNER_ID" not in s:
              raise SystemExit('Could not update diagnostic owner constants')
          if n2 != 1 and "getDiagnosticAccessError" not in s:
              raise SystemExit('Could not update diagnostic access function')
          if n3 != 1 and "const accessError = getDiagnosticAccessError(interaction);" not in s:
              raise SystemExit('Could not update diagnostic handler gate')
          if n4 != 1:
              raise SystemExit('Could not add diagnostic channel check')

          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/bot.js
          node --check src/diagnostics.js
      - name: Validate lock and command schema
        run: |
          node --input-type=module <<'EOF'
          import { diagnosticCommand } from './src/diagnostics.js';
          const json = diagnosticCommand.toJSON();
          if (json.name !== 'test') throw new Error('Expected /test command');
          const expected = ['all','queue','mods','database','armahq','status','channels','permissions','warn','changelog','daily','failsafe'];
          const actual = (json.options || []).map(option => option.name);
          for (const name of expected) if (!actual.includes(name)) throw new Error(`Missing /test ${name}`);
          EOF
          grep -q "DIAGNOSTIC_OWNER_ID = '758072706099970129'" src/diagnostics.js
          grep -q "DIAGNOSTIC_CHANNEL_ID = '1544238980634247189'" src/diagnostics.js
          grep -q "interaction.user.id !== DIAGNOSTIC_OWNER_ID" src/diagnostics.js
          grep -q "interaction.channelId !== DIAGNOSTIC_CHANNEL_ID" src/diagnostics.js
          test "$(grep -c "client.on('interactionCreate'" src/bot.js)" -eq 1
      - name: Commit locked diagnostics
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/diagnostics.js
          git commit -m 'Lock diagnostics to owner and test channel'
          git push origin HEAD:diagnostic-suite-2026-09-01
