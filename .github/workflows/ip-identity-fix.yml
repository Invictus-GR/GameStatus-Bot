name: TLC server identity fix
on:
  push:
    paths: ['.github/workflows/ip-identity-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch identity and live name
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/serverDataSources.js'); s=p.read_text()
          s=s.replace("  serverName,\n  baseUrl", "  serverName,\n  serverAddress = '85.234.84.65:2000',\n  baseUrl", 1)
          old="""    const exact = servers.find(server => server?.name === serverName);
    const id = exact?.id ?? exact?.roomId ?? exact?.room_id;
    if (typeof id !== 'string' || id.length === 0) throw new DataSourceError('ReforgerMods', 'TLC server was not found by exact name');"""
          new="""    const normalizeAddress = value => String(value || '').trim().toLowerCase();
    const targetAddress = normalizeAddress(serverAddress);
    const byAddress = servers.find(server => {
      const candidates = [
        server?.address,
        server?.endpoint,
        server?.ipPort,
        server?.host && server?.port ? `${server.host}:${server.port}` : null,
        server?.ip && server?.port ? `${server.ip}:${server.port}` : null
      ];
      return candidates.some(value => normalizeAddress(value) === targetAddress);
    });
    const exact = byAddress ?? servers.find(server => server?.name === serverName);
    const id = exact?.id ?? exact?.roomId ?? exact?.room_id;
    if (typeof id !== 'string' || id.length === 0) throw new DataSourceError('ReforgerMods', `TLC server was not found by address ${serverAddress} or current name`);"""
          if old not in s: raise SystemExit('discovery anchor missing')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('src/bot.js'); s=p.read_text()
          old="""const reforgerModsClient = createReforgerModsClient({
  fetchImpl: fetch,
  serverName: SERVER_NAME
});"""
          new="""const reforgerModsClient = createReforgerModsClient({
  fetchImpl: fetch,
  serverName: SERVER_NAME,
  serverAddress: '85.234.84.65:2000'
});"""
          if old not in s: raise SystemExit('client anchor missing')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('test/serverDataSources.test.js'); s=p.read_text()
          s += """

test('client prefers stable server address over changing name', async () => {
  const calls = [];
  const fetchImpl = async url => {
    calls.push(String(url));
    if (String(url).includes('battlemetrics.com')) return { ok: false, status: 503 };
    if (String(url).includes('/servers?')) return { ok: true, json: async () => ({
      dataset: { warming: false, stale: false, snapshotAgeSeconds: 5 },
      data: [{ id: 'room-stable', name: 'A NEW NAME', address: '85.234.84.65:2000' }]
    }) };
    return { ok: true, json: async () => ({
      dataset: { warming: false, stale: false, snapshotAgeSeconds: 5 },
      server: { online: true, players: 7, maxPlayers: 128, queue: 1 }
    }) };
  };
  const client = createReforgerModsClient({ fetchImpl, serverName: 'OLD NAME', serverAddress: '85.234.84.65:2000' });
  const status = await client.fetchStatus();
  assert.equal(status.players, 7);
  assert.equal(calls.filter(url => url.includes('/servers?')).length, 1);
});
"""
          p.write_text(s)
      - name: Validate
        run: |
          node --check src/bot.js
          node --check src/serverDataSources.js
          pnpm test
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot.js src/serverDataSources.js test/serverDataSources.test.js
          git commit -m 'Identify TLC server by stable address' || exit 0
          git push
