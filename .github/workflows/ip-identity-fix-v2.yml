name: TLC server identity fix v2

on:
  push:
    paths:
      - '.github/workflows/ip-identity-fix-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply stable TLC identity lookup
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/serverDataSources.js')
          text = path.read_text()

          old_signature = "  serverName,\n  baseUrl"
          new_signature = "  serverName,\n  serverAddress = '85.234.84.65:2000',\n  baseUrl"
          if text.count(old_signature) != 1:
              raise SystemExit(f'Expected one client signature anchor, found {text.count(old_signature)}')
          text = text.replace(old_signature, new_signature, 1)

          old_discovery = """    const exact = servers.find(server => server?.name === serverName);
    const id = exact?.id ?? exact?.roomId ?? exact?.room_id;
    if (typeof id !== 'string' || id.length === 0) throw new DataSourceError('ReforgerMods', 'TLC server was not found by exact name');"""
          new_discovery = """    const normalizeAddress = value => String(value || '').trim().toLowerCase();
    const targetAddress = normalizeAddress(serverAddress);
    const byAddress = servers.find(server => {
      const candidates = [
        server?.address,
        server?.endpoint,
        server?.ipPort,
        server?.host && server?.port ? `${server.host}:${server.port}` : null,
        server?.ip && server?.port ? `${server.ip}:${server.port}` : null
      ];
      return candidates.some(value => normalizeAddress(value) === targetAddress);
    });
    const exact = byAddress ?? servers.find(server => server?.name === serverName);
    const id = exact?.id ?? exact?.roomId ?? exact?.room_id;
    if (typeof id !== 'string' || id.length === 0) {
      throw new DataSourceError('ReforgerMods', `TLC server was not found by address ${serverAddress} or current name`);
    }"""
          if text.count(old_discovery) != 1:
              raise SystemExit(f'Expected one discovery anchor, found {text.count(old_discovery)}')
          text = text.replace(old_discovery, new_discovery, 1)
          path.write_text(text)

          path = Path('src/bot.js')
          text = path.read_text()
          old_client = """const reforgerModsClient = createReforgerModsClient({
  fetchImpl: fetch,
  serverName: SERVER_NAME
});"""
          new_client = """const reforgerModsClient = createReforgerModsClient({
  fetchImpl: fetch,
  serverName: SERVER_NAME,
  serverAddress: '85.234.84.65:2000'
});"""
          if text.count(old_client) != 1:
              raise SystemExit(f'Expected one client initialization anchor, found {text.count(old_client)}')
          text = text.replace(old_client, new_client, 1)
          path.write_text(text)

          path = Path('test/serverDataSources.test.js')
          text = path.read_text()
          marker = "test('client prefers stable server address over changing name'"
          if marker not in text:
              text += """

test('client prefers stable server address over changing name', async () => {
  const calls = [];
  const fetchImpl = async url => {
    calls.push(String(url));
    if (String(url).includes('battlemetrics.com')) {
      return { ok: false, status: 503 };
    }
    if (String(url).includes('/servers?')) {
      return { ok: true, json: async () => ({
        dataset: { warming: false, stale: false, snapshotAgeSeconds: 5 },
        data: [{ id: 'room-stable', name: 'RENAMED TLC SERVER', address: '85.234.84.65:2000' }]
      }) };
    }
    return { ok: true, json: async () => ({
      dataset: { warming: false, stale: false, snapshotAgeSeconds: 5 },
      server: { online: true, players: 7, maxPlayers: 128, queue: 1 }
    }) };
  };
  const client = createReforgerModsClient({
    fetchImpl,
    serverName: 'OLD TLC NAME',
    serverAddress: '85.234.84.65:2000'
  });
  const status = await client.fetchStatus();
  assert.equal(status.players, 7);
  assert.equal(calls.filter(url => url.includes('/servers?')).length, 1);
});
"""
          path.write_text(text)

      - name: Validate
        run: |
          node --check src/bot.js
          node --check src/serverDataSources.js
          pnpm test

      - name: Commit validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot.js src/serverDataSources.js test/serverDataSources.test.js
          git commit -m 'Identify TLC server by stable address' || exit 0
          git push
