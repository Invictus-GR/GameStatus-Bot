name: Probe TLC ReforgerMods server ID

on:
  push:
    paths:
      - '.github/workflows/probe-reforgermods-id.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query ReforgerMods server index
        shell: bash
        run: |
          node <<'NODE'
          const targetName = 'EU | TLC | THE LAST COALITION | UHC | PVP | DEADLOCK GAMEMODE';
          const url = new URL('https://api.reforgermods.net/v2/servers');
          url.searchParams.set('search', targetName);
          url.searchParams.set('includeOffline', 'true');
          url.searchParams.set('perPage', '100');

          const response = await fetch(url, {
            headers: {
              'User-Agent': 'TLC-Command/1.0',
              'X-API-Client': 'TLC-Command/1.0'
            }
          });
          console.log('HTTP', response.status);
          const payload = await response.json();
          console.log('DATASET', JSON.stringify(payload.dataset ?? null));
          const servers = Array.isArray(payload.data) ? payload.data : [];
          console.log('MATCH_COUNT', servers.length);
          for (const server of servers) {
            console.log('SERVER', JSON.stringify({
              id: server.id ?? server.roomId ?? server.room_id ?? null,
              name: server.name ?? null,
              address: server.address ?? null,
              endpoint: server.endpoint ?? null,
              ipPort: server.ipPort ?? null,
              host: server.host ?? null,
              ip: server.ip ?? null,
              port: server.port ?? null
            }));
          }
          NODE
