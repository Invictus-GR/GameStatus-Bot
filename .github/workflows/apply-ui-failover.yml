name: Apply UI data source display
on:
  push:
    branches: [ui-speed-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-speed-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Patch data source display
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/bot.js'); s=p.read_text()
          def one(a,b,n):
            global s
            c=s.count(a)
            if c!=1: raise SystemExit(f'{n}: expected 1 match, got {c}')
            s=s.replace(a,b,1)

          one("let currentServerViewUrl = SERVER_URL;",
              "let currentServerViewUrl = SERVER_URL;\nlet currentStatusDataSource = 'Unavailable';",
              'data source state')

          one("  activeMods = null\n}) {",
              "  activeMods = null,\n  dataSource = 'Unavailable'\n}) {",
              'render data source param')

          one("        {\n          name: '📦 Active Mods',\n          value: activeMods === null ? '**Updating…**' : `**${activeMods}**`,\n          inline: true\n        }\n      )",
              "        {\n          name: '📦 Active Mods',\n          value: activeMods === null ? '**Updating…**' : `**${activeMods}**`,\n          inline: true\n        },\n        {\n          name: '🔗 Data Source',\n          value: dataSource === 'ReforgerMods' ? '**ReforgerMods (Fallback)**' : `**${dataSource}**`,\n          inline: true\n        }\n      )",
              'online data source field')

          one("      .addFields({\n        name: '📡 Status',\n        value: '**OFFLINE**',\n        inline: true\n      })",
              "      .addFields(\n        {\n          name: '📡 Status',\n          value: '**OFFLINE**',\n          inline: true\n        },\n        {\n          name: '🔗 Data Source',\n          value: dataSource === 'ReforgerMods' ? '**ReforgerMods (Fallback)**' : `**${dataSource}**`,\n          inline: true\n        }\n      )",
              'offline data source field')

          one("        name: '📡 Data Source',\n        value: '**All status data sources temporarily unavailable**',",
              "        name: '🔗 Data Source',\n        value: '**Unavailable**',",
              'unavailable data source field')

          one("      serverData = result.value;\n      if (result.source === 'ArmaHQ') {",
              "      serverData = result.value;\n      currentStatusDataSource = result.source;\n      if (result.source === 'ArmaHQ') {",
              'capture source')

          one("  await setBotPresence('🟠 STATUS DATA UNAVAILABLE', 'idle');",
              "  currentStatusDataSource = 'Unavailable';\n  currentServerViewUrl = null;\n  await setBotPresence('🟠 STATUS DATA UNAVAILABLE', 'idle');",
              'unavailable source state')

          one("    await renderStatusPanel({ state: 'unavailable' });",
              "    await renderStatusPanel({ state: 'unavailable', dataSource: currentStatusDataSource });",
              'unavailable render source')

          one("        await renderStatusPanel({ state: 'offline' });",
              "        await renderStatusPanel({ state: 'offline', dataSource: currentStatusDataSource });",
              'offline render source')

          one("        activeMods: previousModSnapshot?.size ?? null\n      });",
              "        activeMods: previousModSnapshot?.size ?? null,\n        dataSource: currentStatusDataSource\n      });",
              'online render source')

          p.write_text(s)
      - run: node --check src/bot.js
      - run: pnpm test
      - name: Commit validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot.js
          git commit -m 'Show active data source in status embed'
          git push origin ui-speed-fix
