name: Apply ReforgerMods fallback integration

on:
  push:
    branches:
      - reforgermods-fallback

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reforgermods-fallback

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Integrate fallback into bot.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/bot.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import {\n  formatCapacityField,\n  SERVER_QUEUE_CAPACITY\n} from './statusDisplay.js';\n",
              "import {\n  formatCapacityField,\n  SERVER_QUEUE_CAPACITY\n} from './statusDisplay.js';\nimport {\n  createReforgerModsClient,\n  withFallback\n} from './serverDataSources.js';\n",
              'fallback import'
          )

          replace_once(
              "const SERVER_NAME = 'EU | TLC | THE LAST COALITION | UHC | PVP | PERSISTENT RANK | DRONES';\n",
              "const SERVER_NAME = 'EU | TLC | THE LAST COALITION | UHC | PVP | PERSISTENT RANK | DRONES';\nconst reforgerModsClient = createReforgerModsClient({\n  fetchImpl: fetch,\n  serverName: SERVER_NAME\n});\n",
              'fallback client init'
          )

          replace_once(
              "        value: '**ArmaHQ temporarily unavailable**',",
              "        value: '**All status data sources temporarily unavailable**',",
              'unavailable panel label'
          )

          replace_once(
              "    `ArmaHQ status check failed (${consecutiveDataSourceFailures} consecutive):`,",
              "    `All status data sources failed (${consecutiveDataSourceFailures} consecutive):`,",
              'data source failure log'
          )

          old_status = '''    let serverData;\n\n    try {\n      const html = await fetchArmaHQPage();\n      serverData = parseServerPage(html);\n    } catch (error) {\n      await handleDataSourceFailure(error);\n      return;\n    }\n\n    consecutiveDataSourceFailures = 0;'''
          new_status = '''    let serverData;\n\n    try {\n      const result = await withFallback({\n        operation: 'status',\n        primary: async () => {\n          const html = await fetchArmaHQPage();\n          return parseServerPage(html);\n        },\n        fallback: () => reforgerModsClient.fetchStatus()\n      });\n      serverData = result.value;\n      if (result.source === 'ReforgerMods') {\n        console.warn('Primary data source unavailable; using ReforgerMods fallback for status.');\n      }\n    } catch (error) {\n      await handleDataSourceFailure(error);\n      return;\n    }\n\n    consecutiveDataSourceFailures = 0;'''
          replace_once(old_status, new_status, 'status fallback integration')

          old_mods = '''async function fetchServerMods() {\n  const html = await fetchArmaHQPage();\n  const modRegex =\n    /\\{\\\\\"name\\\\\":\\\\\"([^\"\\\\]*)\\\\\",\\\\\"modId\\\\\":\\\\\"([^\"\\\\]*)\\\\\",\\\\\"version\\\\\":\\\\\"([^\"\\\\]*)\\\\\"\\}/g;\n\n  const mods = [];\n  let match;\n\n  while ((match = modRegex.exec(html)) !== null) {\n    mods.push({\n      name: match[1],\n      modId: match[2],\n      version: match[3]\n    });\n  }\n\n  const uniqueMods = [\n    ...new Map(mods.map(mod => [mod.modId, mod])).values()\n  ];\n\n  return uniqueMods.sort((a, b) =>\n    a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })\n  );\n}\n'''
          new_mods = '''async function fetchArmaHQMods() {\n  const html = await fetchArmaHQPage();\n  const modRegex =\n    /\\{\\\\\"name\\\\\":\\\\\"([^\"\\\\]*)\\\\\",\\\\\"modId\\\\\":\\\\\"([^\"\\\\]*)\\\\\",\\\\\"version\\\\\":\\\\\"([^\"\\\\]*)\\\\\"\\}/g;\n\n  const mods = [];\n  let match;\n\n  while ((match = modRegex.exec(html)) !== null) {\n    mods.push({\n      name: match[1],\n      modId: match[2],\n      version: match[3]\n    });\n  }\n\n  const uniqueMods = [\n    ...new Map(mods.map(mod => [mod.modId, mod])).values()\n  ];\n\n  const sortedMods = uniqueMods.sort((a, b) =>\n    a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })\n  );\n\n  if (sortedMods.length === 0) {\n    throw new ArmaHQError('ArmaHQ page loaded, but server mod list was empty');\n  }\n\n  return sortedMods;\n}\n\nasync function fetchServerMods() {\n  const result = await withFallback({\n    operation: 'mod list',\n    primary: fetchArmaHQMods,\n    fallback: () => reforgerModsClient.fetchMods()\n  });\n\n  if (result.source === 'ReforgerMods') {\n    console.warn('Primary data source unavailable; using ReforgerMods fallback for mods.');\n  }\n\n  return result.value;\n}\n'''
          replace_once(old_mods, new_mods, 'mods fallback integration')

          path.write_text(text)

      - name: Syntax check
        run: node --check src/bot.js && node --check src/serverDataSources.js

      - name: Run tests
        run: pnpm test

      - name: Commit validated integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot.js
          git commit -m "Integrate ReforgerMods fallback into TLC bot"
          git push origin reforgermods-fallback
