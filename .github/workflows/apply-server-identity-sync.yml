name: Apply server identity sync

on:
  push:
    branches:
      - server-identity-sync

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-identity-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: node scripts/apply-server-identity-sync.mjs
      - run: node --check src/serverDataSources.js
      - run: node --check src/bot.js
      - run: npm test
      - name: Remove one-shot files
        run: |
          rm scripts/apply-server-identity-sync.mjs
          rm .github/workflows/apply-server-identity-sync.yml
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist and proactively sync server identity"
          git push origin HEAD:server-identity-sync
