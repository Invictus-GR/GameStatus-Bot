name: Reliability Validation

on:
  push:
    branches:
      - reliability-audit-2026-09-01
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.5.2 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Syntax check
        run: node --check src/bot.js

      - name: Validate discord.js API surface
        run: |
          node --input-type=module -e "import { SlashCommandBuilder, MessageFlags } from 'discord.js'; const cmd = new SlashCommandBuilder().setName('validation').setDescription('validation').addStringOption(o => o.setName('reason').setDescription('reason').setMaxLength(900).setRequired(true)); if (!MessageFlags.Ephemeral) throw new Error('MessageFlags.Ephemeral missing'); if (!cmd.toJSON()) throw new Error('SlashCommandBuilder failed'); console.log('discord.js API surface OK');"

      - name: Validate node-fetch and AbortController
        run: |
          node --input-type=module -e "import fetch from 'node-fetch'; if (typeof fetch !== 'function') throw new Error('node-fetch default export missing'); const controller = new AbortController(); controller.abort(); console.log('node-fetch + AbortController OK');"

      - name: Validate interaction listener consolidation
        run: |
          COUNT=$(grep -c "client.on('interactionCreate'" src/bot.js)
          test "$COUNT" -eq 1
          echo "interactionCreate listeners: $COUNT"
