name: Fallback log rate-limit check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/fallbackWarning.js'
      - 'src/serverDataSources.js'
      - 'src/bot.js'
      - 'test/fallbackWarning.test.js'
      - 'scripts/apply-fallback-log-rate-limit.mjs'
      - '.github/workflows/fallback-log-rate-limit-check.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply fallback logging patch
        run: node scripts/apply-fallback-log-rate-limit.mjs
      - name: Syntax checks
        run: |
          node --check src/fallbackWarning.js
          node --check src/serverDataSources.js
          node --check src/bot.js
          node --check test/fallbackWarning.test.js
      - name: Full test suite
        run: pnpm test
      - name: Verify patch
        run: git diff --check
      - name: Commit validated patch
        run: |
          if [ -n "$(git status --porcelain src/bot.js src/serverDataSources.js test/fallbackWarning.test.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bot.js src/serverDataSources.js test/fallbackWarning.test.js
            git commit -m "Apply validated fallback warning rate limit"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
