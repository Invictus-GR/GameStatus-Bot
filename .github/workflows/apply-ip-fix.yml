name: Apply TLC identity fix

on:
  push:
    paths:
      - '.github/workflows/apply-ip-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-ip-identity-fix.mjs
      - run: node --check src/serverDataSources.js
      - run: pnpm test
