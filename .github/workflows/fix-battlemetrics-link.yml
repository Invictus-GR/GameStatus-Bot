name: Fix BattleMetrics View Server link

on:
  push:
    paths:
      - '.github/workflows/fix-battlemetrics-link.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Resolve current TLC BattleMetrics server ID
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get --data-urlencode 'filter[search]=85.234.84.65:2000' --data-urlencode 'filter[game]=reforger' 'https://api.battlemetrics.com/servers' > /tmp/bm.json
          BM_ID=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/bm.json', 'utf8'));
          const rows = Array.isArray(payload.data) ? payload.data : [];
          const exact = rows.find(row => { const a = row?.attributes ?? {}; return a.ip === '85.234.84.65' && Number(a.port) === 2000; });
          if (!exact?.id) process.exit(1);
          console.log(exact.id);
          NODE
          )
          echo "BM_ID=$BM_ID" >> "$GITHUB_ENV"
      - name: Patch link and validation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bmId = process.env.BM_ID;
          if (!/^\d+$/.test(bmId ?? '')) throw new Error('Invalid BattleMetrics ID');
          for (const path of ['src/bot.js', 'src/serverDataSources.js']) {
            let text = fs.readFileSync(path, 'utf8');
            text = text.replaceAll('40653024', bmId);
            fs.writeFileSync(path, text);
          }
          const path = 'src/bot.js';
          let bot = fs.readFileSync(path, 'utf8');
          const oldCheck = 'currentServerViewUrl = response.status < 500 ? BATTLEMETRICS_SERVER_URL : null;';
          const newCheck = 'currentServerViewUrl = response.ok ? BATTLEMETRICS_SERVER_URL : null;';
          if (!bot.includes(oldCheck) && !bot.includes(newCheck)) throw new Error('Validation line not found');
          bot = bot.replace(oldCheck, newCheck);
          fs.writeFileSync(path, bot);
          NODE
      - name: Verify public page
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -L --silent --show-error -o /tmp/bm-page.html -w '%{http_code}' "https://www.battlemetrics.com/servers/reforger/${BM_ID}")
          test "$CODE" -ge 200
          test "$CODE" -lt 400
      - name: Validate bot
        run: |
          pnpm install --frozen-lockfile
          node --check src/bot.js
          node --check src/serverDataSources.js
          pnpm test
      - name: Commit validated fix and clean up
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-battlemetrics-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot.js src/serverDataSources.js .github/workflows/fix-battlemetrics-link.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix BattleMetrics View Server fallback link'
          git push
