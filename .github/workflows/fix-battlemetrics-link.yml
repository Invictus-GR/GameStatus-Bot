name: Fix BattleMetrics View Server validation

on:
  push:
    branches:
      - fix/view-server-validation
    paths:
      - '.github/workflows/fix-battlemetrics-link.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Patch View Server validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bot.js')
          s = p.read_text()
          old = 'currentServerViewUrl = response.status < 500 ? BATTLEMETRICS_SERVER_URL : null;'
          new = 'currentServerViewUrl = response.ok ? BATTLEMETRICS_SERVER_URL : null;'
          if old not in s and new not in s:
              raise SystemExit('Expected View Server validation line not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Validate bot
        run: |
          pnpm install --frozen-lockfile
          node --check src/bot.js
          node --check src/serverDataSources.js
          pnpm test
      - name: Commit validated patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-battlemetrics-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bot.js .github/workflows/fix-battlemetrics-link.yml
          git commit -m 'Fix View Server fallback validation'
          git push
